[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-center-tui"
version = "0.2.0"
description = "Moved: this project is now build-a-hyperscaler. Installing this package installs that one."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yusuf0279" }]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
]
dependencies = ["build-a-hyperscaler>=0.2.0"]

[project.urls]
Homepage = "https://github.com/yusuf0279/data-center-tui"
Source = "https://github.com/yusuf0279/data-center-tui"
Issues = "https://github.com/yusuf0279/data-center-tui/issues"
Privacy = "https://github.com/yusuf0279/data-center-tui/blob/main/PRIVACY.md"

[project.scripts]
data-center-tui = "build_a_hyperscaler.game:main"

[tool.setuptools]
packages = []
