[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-center-tui"
dynamic = ["version"]
description = "A pixel-art idle tycoon for your terminal: build servers, hire Vibecoders, survive crises, relocate forever."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yusuf0279" }]
keywords = ["game", "idle", "tycoon", "clicker", "tui", "terminal", "textual", "incremental"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["textual>=8.2"]

[project.urls]
Homepage = "https://github.com/yusuf0279/data-center-tui"
Source = "https://github.com/yusuf0279/data-center-tui"
Issues = "https://github.com/yusuf0279/data-center-tui/issues"
Privacy = "https://github.com/yusuf0279/data-center-tui/blob/main/PRIVACY.md"

[project.scripts]
data-center-tui = "data_center_tui.game:main"

[tool.setuptools]
packages = ["data_center_tui"]

[tool.setuptools.dynamic]
version = { attr = "data_center_tui.__version__" }
