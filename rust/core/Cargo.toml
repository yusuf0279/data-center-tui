[package]
name = "dc-core"
version = "0.1.0"
edition = "2021"
description = "Exact big-integer economy and game model of My Data Center"

[lib]
name = "dc_core"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
proptest = "1"
flate2 = "1"
