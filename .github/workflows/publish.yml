name: Publish to PyPI

# Runs when you publish a GitHub release. It uses PyPI "trusted publishing", so no token is
# stored anywhere: on pypi.org add this repository and workflow under the project's publishing settings.
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
